[project]
name = "agriguide"
version = "1.1.0"
description = "AgriGuide full-stack farming platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-dotenv",
    "sqlalchemy",
    "psycopg[binary]",
    "python-multipart",
    "pytest",
    "httpx2",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.fastapi.static]
cdn = false
exclude = false
