databases:
  - name: agriguide-db
    databaseName: agriguide
    user: agriguide
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: agriguide
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: AGRIGUIDE_MODE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agriguide-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://agriguide.onrender.com
      - key: UPLOAD_DIR
        value: /tmp/agriguide-uploads
